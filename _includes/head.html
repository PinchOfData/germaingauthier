<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% if page.title %}{% assign page_title = page.title | append: " · " | append: site.title %}{% else %}{% assign page_title = site.title %}{% endif %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ site.description }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">

<link href='{{ site.baseurl }}/images/fav.png' rel='icon'>
<link href='{{ site.baseurl }}/stylesheets/style.css' rel='stylesheet' type='text/css' />
